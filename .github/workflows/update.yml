name: 更新法人買賣超資料

on:
  schedule:
    # GitHub cron 為 UTC(Cloudflare 排程準時觸發,這裡是備援)。台股法人資料約收盤後傍晚定案,18:00、20:00 各一次(允許延遲)。
    - cron: '0 10 * * 1-5'   # 台北 18:00
    - cron: '0 12 * * 1-5'   # 台北 20:00
    # 借券賣出約 20:30、22:30 公布,22:45 再跑一次補當天借券、重算出貨分數(其他來源已存在會跳過)。
    # 不帶任何日期參數:每次執行都用當下時間與 DB 決定處理哪天,concurrency 取代待執行的那次才不會漏資料(出貨規格 §5.1)
    - cron: '45 14 * * 1-5'  # 台北 22:45
    # 資料改存 R2 後不再 commit,repo 60 天無活動 GitHub 會停用排程;每月重新啟用一次。
    - cron: '0 0 1 * *'      # 每月 1 日 台北 08:00(只跑 keepalive)
  workflow_dispatch:          # 也可在 Actions 頁面手動觸發

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: 抓取並產生 data.json
        run: node scripts/build-data.mjs
        env:
          TZ: Asia/Taipei

      - name: 上傳 data.json 到 R2
        run: scripts/r2.sh put tw-stocks-data/data.json --file docs/data.json --content-type application/json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---- 吸籌掃描器 ----
      # 放在既有 data.json 流程之後:掃描器任何一步失敗,都不影響「法人同步買超」頁面的更新。

      - name: 下載歷史資料庫
        # 下載失敗就停止(不建新檔),避免暫時性錯誤時用空 DB 覆蓋 R2 上的歷史資料。
        # 首次部署要先在本機 backfill 後手動上傳,見 README。
        run: |
          mkdir -p data
          scripts/r2.sh get tw-stocks-data/db/history.sqlite --file data/history.sqlite
          test -s data/history.sqlite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ingest 每日資料
        run: node scripts/ingest-daily.mjs
        env:
          TZ: Asia/Taipei

      - name: Ingest 集保(有新資料才寫入)
        id: tdcc
        run: node scripts/ingest-weekly.mjs
        env:
          TZ: Asia/Taipei
        continue-on-error: true   # 集保失敗不影響每日流程

      - name: 上傳資料庫
        # ingest 完立刻上傳,評分失敗也不會遺失當天資料(集保 CSV 只有最新一週,錯過就補不回來)
        run: scripts/r2.sh put tw-stocks-data/db/history.sqlite --file data/history.sqlite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 備份資料庫(本次寫入新的集保週)
        # 集保 CSV 只有最新一週,寫入後 DB 是唯一來源,所以每週額外留一份。保留最近 8 份,清理舊檔待辦。
        if: steps.tdcc.outputs.new_tdcc != ''
        run: scripts/r2.sh put "tw-stocks-data/backups/history-${{ steps.tdcc.outputs.new_tdcc }}.sqlite" --file data/history.sqlite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 計算吸籌與出貨分數
        # 出貨評分在 score.mjs 內獨立 try/catch:出貨失敗時吸籌照常輸出,只是不產生 docs/dist.json(下一步會失敗並標示)
        run: node scripts/score.mjs
        env:
          TZ: Asia/Taipei

      - name: 上傳 scan 結果
        run: |
          scripts/r2.sh put tw-stocks-data/scan.json --file docs/scan.json --content-type application/json
          for f in data/features/*.json; do
            scripts/r2.sh put "tw-stocks-data/features/$(basename "$f")" --file "$f" --content-type application/json
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---- 出貨掃描器 ----
      - name: 上傳 dist 結果
        # 放在吸籌上傳之後,失敗不影響吸籌(出貨規格 §5.2)。沒有 dist.json 代表本次出貨評分失敗:
        # R2 保留上一版,前端依 scan_date 顯示「出貨結果停在…」
        continue-on-error: true
        run: |
          test -s docs/dist.json || { echo "::warning::本次出貨評分失敗,沒有產生 docs/dist.json"; exit 1; }
          scripts/r2.sh put tw-stocks-data/dist.json --file docs/dist.json --content-type application/json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 重新啟用本 workflow,避免因 repo 無活動被停用
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
