<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>法人同步買超選股</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ui.css" />
  <script src="theme.js"></script>
</head>
<body>
  <nav class="topnav">
    <a href="index.html" aria-current="page">法人同步買超</a>
    <a href="scan.html">吸籌掃描</a>
    <a href="dist.html">疑似出貨風險</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色/淺色" title="切換深色/淺色">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
  <header>
    <h1>法人同步買超選股</h1>
    <p class="sub" id="meta">資料載入中…</p>
  </header>

  <section class="controls">
    <label>累計天數
      <select id="sumDays"></select>
    </label>
    <label>連續買超天數
      <select id="streakDays"></select>
    </label>
    <span class="market-group">
      <label class="chk"><input type="checkbox" id="i_foreign" /> 外資</label>
      <label class="chk"><input type="checkbox" id="i_trust" /> 投信</label>
      <label class="chk"><input type="checkbox" id="i_dealer" /> 自營商</label>
    </span>
    <span class="market-group">
      <label class="chk"><input type="checkbox" id="mTWSE" checked /> 上市</label>
      <label class="chk"><input type="checkbox" id="mTPEX" checked /> 上櫃</label>
    </span>
    <span class="count" id="count"></span>
  </section>

  <main>
    <div class="table-wrap">
      <table id="tbl">
        <thead>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>沒有符合條件的股票。試著放寬「連續買超天數」、少勾幾個法人,或勾選更多市場。</p>
  </main>

  <footer>
    <details open>
    <summary>說明與資料來源</summary>
    <p>篩選條件:勾選的法人(外資/投信/自營商)<strong>各自</strong>在「累計天數」內淨買超 &gt; 0,且最近「連續買超天數」每天都買超。數值單位為<strong>張</strong>。</p>
    <p class="disc">資料來源:臺灣證券交易所 (TWSE) 與證券櫃檯買賣中心 (TPEX)。本頁僅供參考,<strong>非投資建議</strong>。</p>
    </details>
  </footer>
  <script>/* 手機預設收合說明,把空間留給表格 */
    if (matchMedia('(max-width: 560px)').matches) document.querySelector('footer details').open = false;</script>

  <script src="app.js"></script>
</body>
</html>
